<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code along - Quiz activity</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>Quiz Form</h1>
    <form action="">
        <fieldset>
            <div class="question">
                <label for="q1">1. What is the first tag to create a principal heading? only enter the tag name</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div class="question">
                <label for="q2">2. In your own words, explain what is the different between the tags label and p</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="question">
                <label for="q3">3. Which CSS property allow you use "wrap"</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="flex">Flex</option>
                    <option value="grid">Grid</option>
                    <option value="position">Position</option>
                </select>
            </div>
            <div class="question">
                <label for="q4">4. How many heading levels exist in HTML?</label>
                <input type="number" name="q4" id="q4">
            </div>
        </fieldset>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
